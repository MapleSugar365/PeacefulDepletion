modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MapleSugar365/PeacefulDepletion/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL=""
displayURL="https://github.com/MapleSugar365/PeacefulDepletion"
#credits=""
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory = true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory = true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

